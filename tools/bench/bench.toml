# darktable's jobs on a bench box (the mcu repository): what each job runs
# and what it requests: threads (cores), an estimate of its memory, the
# exclusive resources it needs, network, mounts, a timeout. The box refuses
# a job that requests more than the project's ceiling, set by its admin,
# and learns each job's real memory peak.
containerfile = "tools/bench/image/Containerfile"

[cache]
build = "the build tree and the installed prefix, kept for incremental builds"
ccache = "the compiler cache"
perf = "the perf bench's synthetic 100,000-image library, built once"

[jobs.build]
cores = 6
memory = "4g"
command = "/src/tools/bench/job build"
mounts = { build = "/build", ccache = "/ccache" }
timeout = "1h"

[jobs.ctest]
cores = 2
memory = "2g"
command = "/src/tools/bench/job ctest"
mounts = { build = "/build" }
timeout = "30m"

# the equivalence and GUI benches compare outputs, not durations, but they
# diverge under CPU load (late writes): they hold the whole machine
[jobs.run]
cores = 4
memory = "3g"
exclusive = ["machine"]
command = "/src/tools/bench/job run"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-labels]
cores = 4
memory = "3g"
exclusive = ["machine"]
command = "/src/tools/bench/job gui-labels"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-metadata]
cores = 4
memory = "3g"
exclusive = ["machine"]
command = "/src/tools/bench/job gui-metadata"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-tags]
cores = 4
memory = "3g"
exclusive = ["machine"]
command = "/src/tools/bench/job gui-tags"
mounts = { build = "/build" }
timeout = "20m"

# the pixel suite pins OpenMP to 4 threads (its run script); its outputs do
# not depend on load, and each container has its own /tmp, so it shares
# the box with other jobs
[jobs.pixel]
cores = 4
memory = "4g"
command = "/src/tools/bench/job pixel"
mounts = { build = "/build" }
timeout = "2h"

[jobs.pixel-fast]
cores = 4
memory = "3g"
command = "/src/tools/bench/job pixel-fast"
mounts = { build = "/build" }
timeout = "20m"

[volumes.darktable-cli]
cores = 6
provision = "/src/tools/bench/job install-to /volume"
mounts = { build = "/build", ccache = "/ccache" }
timeout = "1h"

[volumes.darktable-tests]
provision = "tar -C /src/src/tests/integration --exclude=.git --exclude=.venv -cf - . | tar -C /volume -xf -"
timeout = "20m"

# the fast subset at 1, 2, 4 and 8 OpenMP threads and with -t 4 on two
# CPUs, compared pixel by pixel with -t 4 (darktable #3807)
[jobs.threads]
cores = 8
memory = "4g"
command = "/src/tools/bench/job threads"
mounts = { build = "/build" }
timeout = "1h"

# timings: alone on the machine
[jobs.perf]
cores = 4
memory = "4g"
exclusive = ["machine"]
command = "/src/tools/bench/job perf"
mounts = { build = "/build", perf = "/perf" }
timeout = "2h"
