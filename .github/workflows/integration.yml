name: integration (fork measurement)

# Fork only (darktable #3958): measures the pixel integration suite on
# GitHub's runners, on a RelWithDebInfo build (Release adds -ffast-math,
# src/CMakeLists.txt). Not meant for upstream as is.

on:
  push:
    branches: [helios/ci-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    if: github.repository == 'quazardous/darktable'
    name: suite run ${{ matrix.run }} ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    container:
      image: ubuntu:26.04
      options: --tmpfs /tmp:exec
    strategy:
      fail-fast: false
      matrix:
        # strict: the suite's verdict; tolerant: .ci/deltae's DT_TESTS_TOLERANT
        include:
          - { run: 1, mode: strict }
          - { run: 2, mode: tolerant }
    env:
      CC: gcc-16
      CXX: g++-16
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_PREFIX: ${{ github.workspace }}/install
      ECO: -DDONT_USE_INTERNAL_LIBRAW=ON
      CMAKE_BUILD_TYPE: RelWithDebInfo
      GENERATOR: Ninja
      TARGET: skiptest
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          set -xe
          apt-get --yes update
          apt-get --yes install eatmydata
          eatmydata apt-get --yes install gcc-16 g++-16 \
            build-essential cmake appstream-util desktop-file-utils gettext git gdb intltool \
            libarchive-dev libatk1.0-dev libavif-dev libcairo2-dev libcmocka-dev libcolord-dev \
            libcolord-gtk-dev libcups2-dev libcurl4-gnutls-dev libexiv2-dev libgdk-pixbuf-2.0-dev \
            libglib2.0-dev libgmic-dev libgphoto2-dev libgraphicsmagick1-dev libgtk-3-dev \
            libheif-dev libjpeg-dev libjson-glib-dev liblcms2-dev liblensfun-dev liblua5.4-dev \
            libonnxruntime-dev libopencv-calib3d-dev libopencv-core-dev libopencv-features2d-dev \
            libopencv-flann-dev libopencv-imgproc-dev libopenexr-dev libopenjp2-7-dev \
            libosmgpsmap-1.0-dev libpango1.0-dev libpng-dev libportmidi-dev libpotrace-dev \
            libpugixml-dev libraw-dev librsvg2-dev libsaxon-java libsdl2-dev libsecret-1-dev \
            libsqlite3-dev libtiff5-dev libwebp-dev libx11-dev libxml2-dev libxml2-utils \
            ninja-build perl po4a python3-jsonschema xsltproc zlib1g-dev \
            python3-venv imagemagick time
      - uses: actions/checkout@v7
        with:
          submodules: false
          path: src
          fetch-depth: 1
      - name: Submodules, the integration suite at depth 1
        run: |
          cd src
          git submodule update --init --depth 1
          du -sh src/tests/integration
      - name: spektrafilm data pack (0179, 0180)
        # the module reads a pack installed by hand from
        # $XDG_DATA_HOME/darktable/spektrafilm (src/iop/spektrafilm.c); the
        # commit is pinned so the references do not move with the pack
        run: |
          git clone --quiet --no-checkout --filter=blob:none https://github.com/darktable-org/darktable-spektrafilm.git sf
          git -C sf checkout --quiet b15cfe18fb35ec15084f78c986b0ebc730338e6e -- packs/0.3.3
          mkdir -p "$GITHUB_WORKSPACE/xdg-data/darktable"
          cp -r sf/packs/0.3.3 "$GITHUB_WORKSPACE/xdg-data/darktable/spektrafilm"
          ls -R "$GITHUB_WORKSPACE/xdg-data/darktable/spektrafilm" | head
      - name: Build (RelWithDebInfo)
        run: |
          cmake -E make_directory "$BUILD_DIR" "$INSTALL_PREFIX"
          /usr/bin/time -f "build: %e s" ./src/.ci/ci-script.sh
      - name: Machine
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; free -g
      - name: Integration suite
        working-directory: src/src/tests/integration
        env:
          DARKTABLE_CLI: ${{ github.workspace }}/install/bin/darktable-cli
          XDG_DATA_HOME: ${{ github.workspace }}/xdg-data
          DT_TESTS_TOLERANT: ${{ matrix.mode == 'tolerant' && '1' || '' }}
        run: |
          # the drop-in: pixel-equality shortcut, and the tolerant verdict
          cp ../../../.ci/deltae deltae
          /usr/bin/time -f "suite: %e s wall, %U s user" ./run --disable-opencl 2>&1 | tee ../../../../suite.log || true
          tail -30 ../../../../suite.log
      - name: dE statistics, timed on their own
        working-directory: src/src/tests/integration
        run: |
          . .venv/bin/activate
          /usr/bin/time -f "stats: %e s" python ../../../.ci/integration_stats.py . ../../../../stats-${{ matrix.run }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-run-${{ matrix.run }}
          path: |
            suite.log
            stats-${{ matrix.run }}.json
            src/src/tests/integration/logs/
