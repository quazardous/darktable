# darktable's jobs on the bench box (mcu, darktable aiball #3887): what each
# job runs and the rights it requests. The box refuses a job that requests
# more than the project's ceiling, set by the box admin.
containerfile = "tools/bench/image/Containerfile"

[cache]
build = "the build tree and the installed prefix, kept for incremental builds"
ccache = "the compiler cache"

[jobs.build]
class = "correctness"
command = "/src/tools/bench/job build"
mounts = { build = "/build", ccache = "/ccache" }
timeout = "1h"

[jobs.ctest]
class = "correctness"
command = "/src/tools/bench/job ctest"
mounts = { build = "/build" }
timeout = "30m"

# the equivalence and GUI benches compare outputs, not durations, but they
# diverge under CPU load (late writes), so they run alone like timing jobs
[jobs.run]
class = "timing"
command = "/src/tools/bench/job run"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-labels]
class = "timing"
command = "/src/tools/bench/job gui-labels"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-metadata]
class = "timing"
command = "/src/tools/bench/job gui-metadata"
mounts = { build = "/build" }
timeout = "20m"

[jobs.gui-tags]
class = "timing"
command = "/src/tools/bench/job gui-tags"
mounts = { build = "/build" }
timeout = "20m"

# each pixel test already takes every core it is given through OpenMP
[jobs.pixel]
class = "timing"
command = "/src/tools/bench/job pixel"
mounts = { build = "/build" }
timeout = "2h"

[volumes.darktable-cli]
provision = "/src/tools/bench/job install-to /volume"
mounts = { build = "/build", ccache = "/ccache" }
timeout = "1h"

[volumes.darktable-tests]
provision = "tar -C /src/src/tests/integration --exclude=.git --exclude=.venv -cf - . | tar -C /volume -xf -"
timeout = "20m"
